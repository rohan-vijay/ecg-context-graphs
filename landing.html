// ─── DETERMINISTIC MINI-GRAPH ────────────────────────────────────────────────

function seededRandom(seed) {
  let s = seed;
  return function() {
    s = (s * 1664525 + 1013904223) & 0xffffffff;
    return ((s >>> 0) / 0xffffffff);
  };
}

const VB_W = 400, VB_H = 200;

function MiniGraph({ graph }) {
  const rand = seededRandom(graph.id.charCodeAt(0) * 7 + graph.nodes);
  const nodeCount = 8 + Math.floor(rand() * 5);
  const px = 36, py = 28;
  const nodes = Array.from({ length: nodeCount }, (_, i) => ({
    x: px + rand() * (VB_W - px * 2),
    y: py + rand() * (VB_H - py * 2),
    r: 5 + rand() * 8,
  }));
  const edges = [];
  const edgeCount = Math.floor(nodeCount * 1.4);
  for (let i = 0; i < edgeCount; i++) {
    const a = Math.floor(rand() * nodeCount);
    const b = Math.floor(rand() * nodeCount);
    if (a !== b) edges.push([a, b]);
  }

  return (
    <svg
      viewBox={`0 0 ${VB_W} ${VB_H}`}
      preserveAspectRatio="xMidYMid meet"
      style={{ display: "block", width: "100%", height: "100%" }}
    >
      <defs>
        <radialGradient id={"glow-" + graph.id} cx="50%" cy="50%" r="50%">
          <stop offset="0%" stopColor={graph.color.node} stopOpacity="0.28" />
          <stop offset="100%" stopColor={graph.color.node} stopOpacity="0" />
        </radialGradient>
      </defs>
      <rect x="0" y="0" width={VB_W} height={VB_H} fill={graph.color.bg} />
      <ellipse cx={VB_W / 2} cy={VB_H / 2} rx={VB_W * 0.46} ry={VB_H * 0.44} fill={`url(#glow-${graph.id})`} />
      {edges.map(([a, b], i) => (
        <line key={i}
          x1={nodes[a].x} y1={nodes[a].y}
          x2={nodes[b].x} y2={nodes[b].y}
          stroke={graph.color.edge} strokeWidth="1.1" opacity="0.65"
        />
      ))}
      {nodes.map((n, i) => (
        <circle key={i} cx={n.x} cy={n.y} r={n.r} fill={graph.color.node} opacity={0.65 + (i % 3) * 0.12} />
      ))}
    </svg>
  );
}

const SORT_OPTIONS = ["Most active", "Health ↓", "Health ↑", "Nodes ↓", "Nodes ↑", "A–Z", "Recently synced"];
const DOMAIN_FILTERS = ["All", "Revenue", "Finance", "Customer", "Product", "Governance", "Support", "People", "Platform"];

  const [viewMode, setViewMode] = useState("grid");
  const [sort, setSort] = useState("Most active");
  const [filter, setFilter] = useState("All");
  const [search, setSearch] = useState("");
  const [showNew, setShowNew] = useState(false);
  const [sortOpen, setSortOpen] = useState(false);
  const [filterOpen, setFilterOpen] = useState(false);

  const filtered = useMemo(() => {
    let gs = [...GRAPHS];
    if (filter !== "All") gs = gs.filter(g => g.domain === filter);
    if (search) gs = gs.filter(g => g.title.toLowerCase().includes(search.toLowerCase()) || g.label.toLowerCase().includes(search.toLowerCase()) || g.desc.toLowerCase().includes(search.toLowerCase()));
    const sorters = {
      "Most active": (a, b) => b.edges - a.edges,
      "Health ↓":   (a, b) => b.health - a.health,
      "Health ↑":   (a, b) => a.health - b.health,
      "Nodes ↓":    (a, b) => b.nodes - a.nodes,
      "Nodes ↑":    (a, b) => a.nodes - b.nodes,
      "A–Z":        (a, b) => a.title.localeCompare(b.title),
      "Recently synced": (a, b) => parseInt(a.synced) - parseInt(b.synced),
    };
    return gs.sort(sorters[sort] || sorters["Most active"]);
  }, [filter, sort, search]);

  const totalEdges  = GRAPHS.reduce((s, g) => s + g.edges, 0);
  const totalAgents = GRAPHS.reduce((s, g) => s + g.agents, 0);

          </div>

            </button>
            <button className={"vt" + (viewMode === "list" ? " on" : "")} onClick={() => setViewMode("list")} title="List view">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" /><line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" /><line x1="3" y1="18" x2="21" y2="18" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" /></svg>
            </button>

      </div>

      {/* ── GRAPH GRID ── */}
      <main className={"main" + (viewMode === "list" ? " list-mode" : "")}>
        {filtered.length === 0 ? (
          <div className="empty-state">
            <div className="empty-icon">◌</div>
            <div className="empty-title">No graphs match</div>
            <div className="empty-desc">Try a different filter or search term.</div>
            <button className="btn-ghost" onClick={() => { setFilter("All"); setSearch(""); }}>Clear filters</button>
          </div>
        ) : viewMode === "grid" ? (
          <div className="grid">
            {filtered.map(g => <GraphCard key={g.id} graph={g} viewMode="grid" />)}
          </div>
        ) : (
          <div className="list-wrap">
            {filtered.map(g => <GraphCard key={g.id} graph={g} viewMode="list" />)}
          </div>
        )}
      </main>

      {/* ── STATUS BAR ── */}
      <div className="statusbar">
        <span>ECG · Graph Registry · v3.2</span>
        <span className="sb-sep">·</span>
        <span>{GRAPHS.length} graphs · {GRAPHS.filter(g=>g.health_ok).length} healthy</span>
        <span style={{ flex: 1 }} />
        <span className="sb-ok">● all systems nominal</span>
      </div>

      {showNew && <NewGraphModal onClose={() => setShowNew(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
